<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 320" width="490" height="320">
  <defs>
    <style>
      .bg { fill: #0d1117; } /* Black bg */
      .text { font-family: "Courier New", Consolas, monospace; font-size: 14px; fill: #c9d1d9; opacity: 0; animation: fadeIn 0.5s ease forwards; }
      .label { fill: #79c0ff; font-weight: bold; } /* blue keys */
      .prompt { fill: #3fb950; font-weight: bold; } /* green */
      
      /* Animação de fade in e leve slide */
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateX(-10px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      
      .line1 { animation-delay: 0.2s; }
      .line2 { animation-delay: 0.4s; }
      .line3 { animation-delay: 0.6s; }
      .line4 { animation-delay: 0.8s; }
      .line5 { animation-delay: 1.0s; }
      .line6 { animation-delay: 1.2s; }
      .line7 { animation-delay: 1.4s; }
    </style>
  </defs>
  
  <!-- background -->
  <rect class="bg" width="100%" height="100%" rx="6" />
  
  <!-- Botões da janela do terminal -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <!-- Style Neofetch -->
  <text x="20" y="60" class="text line1"><tspan class="prompt">guilherme@github</tspan>:~$ neofetch</text>
  
  <text x="20" y="100" class="text line2"><tspan class="label">OS</tspan>         Windows 11 / WSL Ubuntu</text>
  <text x="20" y="130" class="text line3"><tspan class="label">Role</tspan>       Engenharia da Computação @ UFRGS</text>
  <text x="20" y="190" class="text line5"><tspan class="label">Stack</tspan>      C++, Dart, Kotlin, React, Node.js</text>
  <text x="20" y="220" class="text line6"><tspan class="label">Hobbies</tspan>    RPG Tabletop, Cosplay and Video Games</text>
  <text x="20" y="250" class="text line7"><tspan class="label">Contact</tspan>    mulazzani.guilherme@gmail.com</text>
</svg>